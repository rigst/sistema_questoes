{% comment %}
Checkbox de aceite. Nunca renderize `checked` aqui: o campo nasce com
initial=False e a obrigatoriedade é validada no servidor.
(Comentário em bloco: `{# #}` no Django só vale para uma linha.)
{% endcomment %}
<div class="legal-aceite{% if field.errors %} legal-aceite-erro{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field }}
        <span>{{ field.label }}</span>
    </label>
    {% if field.errors %}
        <p class="legal-aceite-msg" role="alert">{{ field.errors.0 }}</p>
    {% endif %}
</div>
