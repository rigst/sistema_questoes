<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro interno · Estudo por Questões</title>
    <style>
        body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: #eef0f4; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { text-align: center; padding: 3rem 2rem; background: #fff; border: 1px solid #e7e9ee; border-radius: 1.5rem; max-width: 26rem; margin: 1rem; }
        h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
        p { color: #6b7280; line-height: 1.6; margin: 0 0 1.5rem; }
        a { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: .65rem 1.4rem; border-radius: 999px; font-size: .95rem; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Algo deu errado</h1>
        <p>Ocorreu um erro interno ao processar sua solicitação. Tente novamente em instantes.</p>
        <a href="/">Voltar ao início</a>
    </div>
</body>
</html>
