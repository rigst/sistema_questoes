[pytest]
# Settings de desenvolvimento: SQLite, sem depender de Postgres nem de Redis.
# Os de produção não servem para teste — SECURE_SSL_REDIRECT transforma todo
# request do test client em 301.
DJANGO_SETTINGS_MODULE = config.settings.development

# O padrão do pytest é test_*.py, que não encontra nada aqui: a convenção do
# projeto é tests.py por app. Sem esta linha a suíte é coletada vazia.
python_files = tests.py tests_*.py test_*.py

# Restringe a busca aos apps: deploy/ e scripts/ têm .py que não são teste.
testpaths = accounts ai exams legal prompts questions reports

addopts = --strict-markers
