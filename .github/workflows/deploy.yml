# a ponta antes de confiar no gatilho automático (ver RUNBOOK.md do rigst/ci,
# seção 7.5).

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: rigst/ci/.github/workflows/deploy-django.yml@732567a09cf722a7d5534789e8dcf553f7dcbf8f  # v1
    secrets:
      CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
    with:
      ssh-host: "questoes.stolben.com"
